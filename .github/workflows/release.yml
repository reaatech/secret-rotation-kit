name: Release

on:
  workflow_dispatch:
  # NOTE: Add `push: branches: [main]` AFTER the first manual publish succeeds

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Token-based publish with build provenance. Requires an NPM_TOKEN
          # secret (an npm automation token with publish access).
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          # UPGRADE PATH — after the first successful publish, you can switch to
          # OIDC trusted publishing (no long-lived token): on npmjs.com add a
          # Trusted Publisher for each @reaatech/* package pointing at
          # `reaatech/secret-rotation-kit` + this workflow, then remove the
          # NPM_TOKEN line above (`id-token: write` is already granted, and
          # pnpm >= 10.12 performs the OIDC exchange automatically).
          # https://docs.npmjs.com/trusted-publishers

      - name: Mirror published packages to GitHub Packages
        if: steps.changesets.outputs.published == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          cat > .npmrc <<EOF
          @reaatech:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          EOF
          echo "$PUBLISHED_PACKAGES" | jq -r '.[].name' | while read -r name; do
            dir="packages/${name#@reaatech/secret-rotation-}"
            echo "Mirroring $name -> $dir"
            (cd "$dir" && npm publish --registry=https://npm.pkg.github.com)
          done
